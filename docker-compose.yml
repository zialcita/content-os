services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contentos
      POSTGRES_PASSWORD: contentos
      POSTGRES_DB: contentos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-vector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentos -d contentos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
